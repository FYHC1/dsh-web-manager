name: offline-bundle

# Builds the offline installers:
#   windows setup EXE    -> dsh-webui-desktop-win-<ver>.exe
#   wsl deb              -> dsh-webui-desktop-wsl-<ver>.deb
#   wsl rpm              -> dsh-webui-desktop-wsl-<ver>.rpm
#   bundle zip           -> dsh-webui-desktop-win-<ver>.zip
# A tag push (v*) also publishes a GitHub Release with all artifacts. Gated to
# the dsh-webui-desktop repo: dsh-web-manager publishes its own versioned
# exe/runtime-zip assets instead of the offline-bundle set.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dsh-version:
        description: 'dsh npm version spec'
        default: 'latest'
      node-version:
        description: 'portable Node version'
        default: '24.19.0'

permissions:
  contents: write

jobs:
  wsl-payload:
    if: github.repository == 'FYHC1/dsh-webui-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WSL payload
        run: |
          bash scripts/Build-Bundle-Wsl.sh \
            --node-version "${{ inputs.node-version || '24.19.0' }}" \
            --dsh-version "${{ inputs.dsh-version || 'latest' }}"
      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: bundle-wsl
          path: bundle-out/bundle-wsl/
      - name: Build deb
        run: bash scripts/Build-Deb.sh --payload bundle-out/bundle-wsl
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: wsl-deb
          path: bundle-out/dsh-bundle-wsl_*_amd64.deb

  rpm:
    needs: wsl-payload
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - run: dnf install -y git tar rpm-build grep
      - uses: actions/checkout@v4
      - name: Download WSL payload
        uses: actions/download-artifact@v4
        with:
          name: bundle-wsl
          path: bundle-out/bundle-wsl
      - name: Build rpm
        run: bash scripts/Build-Rpm.sh --payload bundle-out/bundle-wsl
      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: wsl-rpm
          path: bundle-out/dsh-bundle-wsl-*.rpm

  windows-installer:
    needs: wsl-payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download WSL payload
        uses: actions/download-artifact@v4
        with:
          name: bundle-wsl
          path: bundle-out/bundle-wsl
      - name: Fetch WebView2 SDK assemblies
        run: powershell -NoProfile -ExecutionPolicy Bypass -File lib\Get-WebView2.ps1
      - name: Build manager dist + assemble bundle (merge WSL payload)
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Build-Bundle.ps1
          -NodeVersion "${{ inputs.node-version || '24.19.0' }}"
          -DshVersion "${{ inputs.dsh-version || 'latest' }}"
          -WslPayloadDir "bundle-out\bundle-wsl"
      - name: Assemble setup payload (single-archive staging)
        # The setup EXE ships the heavy trees (node/dsh/profile-web/wsl) as ONE
        # payload.zip instead of ~200k Inno [Files] entries - Install-Offline.ps1
        # streams it to the final root with the system tar (see Prepare-Setup.ps1).
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\Prepare-Setup.ps1
          -BundleDir "bundle-out\dsh-offline-bundle"
          -OutDir "bundle-out\setup-stage"
      - name: Zip the raw bundle
        run: |
          $ver = (Get-Content bundle-out\dsh-offline-bundle\bundle.json -Raw | ConvertFrom-Json).BundleVersion
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "ci" }
          # 7z handles the ~1GB tree reliably (Compress-Archive can OOM at this size)
          7z a -tzip "bundle-out\dsh-offline-bundle-$ver-$tag.zip" "bundle-out\dsh-offline-bundle\*" | Out-Null
          if (-not $?) { throw "7z zip failed" }
          "BUNDLE_ZIP=dsh-offline-bundle-$ver-$tag.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: powershell
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Stage bundle at a short path for ISCC
        # Inno Setup cannot open source files with paths > MAX_PATH (260 chars).
        # The npm/pnpm trees go deeper than that under the repo checkout, so Inno
        # aborts with "cannot find the path specified" on the first file past the
        # limit. Copy the SETUP STAGE (small files + one payload.zip) to a short
        # root so every source path stays under 260. Verified locally with Inno
        # 6.7.3: a 270-char source path fails, a 228-char one compiles.
        # NOTE: must run under pwsh — `shell: powershell` maps to Windows
        # PowerShell 5.1 here (whose Copy-Item glob semantics choke on the tree).
        shell: pwsh
        run: |
          Remove-Item D:\bundle -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "bundle-out\setup-stage\dsh-offline-bundle" -Destination "D:\bundle" -Recurse
          if (Test-Path D:\bundle\bundle.json) {
            $bundleShort = "D:\bundle"
          } elseif (Test-Path "D:\bundle\dsh-offline-bundle\bundle.json") {
            $bundleShort = "D:\bundle\dsh-offline-bundle"
          } else {
            throw "bundle staging failed: bundle.json not found"
          }
          "BUNDLE_SHORT=$bundleShort" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compile setup EXE
        shell: pwsh
        run: |
          $ver = (Get-Content bundle-out\dsh-offline-bundle\bundle.json -Raw | ConvertFrom-Json).Manager.Version
          $mv = ($ver -split '\.')[0..2] -join '.'
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "ci" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DBundleDir=$env:BUNDLE_SHORT" `
            "/DMyVersion=$mv" "/DPayloadTag=$tag" `
            ".\packaging\windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: bundle-out/dsh-offline-bundle-setup_*.exe
      - name: Upload bundle zip
        uses: actions/upload-artifact@v4
        with:
          name: bundle-zip
          path: bundle-out/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wsl-payload, windows-installer, rpm]
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes needs a git worktree; the previous
      # version had no checkout here and failed with "not a git repository".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets (versioned names)
        # Naming convention: dsh-webui-desktop-{win,wsl}-<version>.{exe,deb,rpm,zip}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          cp artifacts/wsl-deb/dsh-bundle-wsl_*_amd64.deb "artifacts/dsh-webui-desktop-wsl-${ver}.deb"
          cp artifacts/wsl-rpm/dsh-bundle-wsl-*.rpm "artifacts/dsh-webui-desktop-wsl-${ver}.rpm"
          cp artifacts/windows-setup/dsh-offline-bundle-setup_*.exe "artifacts/dsh-webui-desktop-win-${ver}.exe"
          cp artifacts/bundle-zip/dsh-offline-bundle-*.zip "artifacts/dsh-webui-desktop-win-${ver}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes \
            artifacts/dsh-webui-desktop-*
